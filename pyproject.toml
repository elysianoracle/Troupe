[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "troupe"
version = "0.1.0"
description = "Self-hosted team of persistent AI agents: named roster, group chat, per-agent sandboxes, memory, skills, schedules, email, approvals."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "croniter>=2.0",
    "cryptography>=42",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
local-browser = ["playwright>=1.55"]

[project.scripts]
troupe = "troupe.main:main"

[tool.setuptools]
packages = ["troupe", "troupe.surfaces"]

[tool.setuptools.package-data]
troupe = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
